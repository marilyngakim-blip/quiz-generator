<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Senarai Kuiz</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="wrap">
    <h1>Senarai Kuiz</h1>
    <p class="muted">Pilih kuiz yang diberikan oleh guru anda.</p>
    <div class="card"><ul class="list" id="list"><li class="muted">Memuatkan…</li></ul></div>
  </div>
  <script>
    fetch('quizzes/index.json', { cache: 'no-store' })
      .then(r => r.json())
      .then(items => {
        const list = document.getElementById('list');
        list.innerHTML = '';
        items.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
        if (!items.length) list.innerHTML = '<li class="muted">Belum ada kuiz.</li>';
        for (const it of items) {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = 'quiz.html?id=' + encodeURIComponent(it.id);
          a.textContent = it.title;
          const meta = document.createElement('div');
          meta.className = 'muted';
          meta.textContent = it.questionCount + ' soalan';
          li.append(a, meta);
          list.append(li);
        }
      })
      .catch(() => {
        document.getElementById('list').innerHTML = '<li class="error">Senarai kuiz tidak dapat dimuatkan.</li>';
      });
  </script>
</body>
</html>
